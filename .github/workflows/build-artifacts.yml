# Build private downloadable candidates; never publish a GitHub Release.
name: Build candidate binaries
run-name: v0.2.2 candidate binaries (${{ github.sha }})
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-artifacts.yml
      - scripts/package-candidate.py
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, suffix: '', flags: '' }
          - { os: macos-15, target: x86_64-apple-darwin, suffix: '', flags: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: '.exe', flags: '-C target-feature=+crt-static' }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, suffix: '', flags: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, suffix: '', flags: '' }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.flags }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke-test native binary
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo run --release --locked --target ${{ matrix.target }} -- self-test
      - name: Package binary, policy, documentation and checksum
        run: python scripts/package-candidate.py --binary target/${{ matrix.target }}/release/agent-dlp${{ matrix.suffix }} --target ${{ matrix.target }} --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: agent-dlp-lite-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
