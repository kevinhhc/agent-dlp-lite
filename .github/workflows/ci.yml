name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cargo run --release --locked -- self-test
      - run: python scripts/benchmark.py target/release/agent-dlp${{ runner.os == 'Windows' && '.exe' || '' }} --samples 30 --output benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark.json
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit -D unmaintained
