[package]
name = "agent-dlp-lite"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "Offline, bounded local DLP hooks for coding agents"
license = "Apache-2.0"
publish = false

[[bin]]
name = "agent-dlp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.2", default-features = false, features = ["serialize", "deserialize"] }
shlex = "1.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
